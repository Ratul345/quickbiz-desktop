[package]
name = "quickbiz-desktop"
version = "1.0.1"
edition = "2021"
description = "QuickBiz for Windows: native desktop app for income, expenses, inventory and reports"
publish = false

[features]
# Microsoft Store build: no self-update (the Store updates the app).
store = []
# Screenshot mode for the Store listing: loads made-up sample data and saves screenshots. Never in a release build.
demo = ["dep:image"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
eframe = "0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
